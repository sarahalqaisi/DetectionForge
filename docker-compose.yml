services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: detectionforge
      POSTGRES_USER: detectionforge
      POSTGRES_PASSWORD: detectionforge-dev-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U detectionforge"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - detectionforge_postgres:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      SECRET_KEY: replace-this-in-production
      DATABASE_URL: postgresql+psycopg://detectionforge:detectionforge-dev-only@db:5432/detectionforge
      HOST: 0.0.0.0
      PORT: 8000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./reports:/app/reports

volumes:
  detectionforge_postgres:
